# FIA — the IAI Agent Factory (agent roster for FDAs)
#
# ═══════════════════════════════════════════════════════════════════════════
# EACH AGENT WITH ITS ENGINE AND MODEL — this file is the single source of
# truth. FDAs never name a model; they name an AGENT (planner, builder…).
# Visual editor: `npm run agents` (or /agents inside `pi`) — the Agents tab
# reads and saves this file, preserving these comments.
#
# coding_agent (the engine):
#   claude_code → official `claude` CLI — Claude Pro/Max subscription (plan
#                 limits). Login: run `claude` once.
#                 `model`: alias (sonnet | opus | haiku | fable) or full name
#                 (e.g. claude-opus-5). Without `model`, the plan default.
#                 `effort`: low | medium | high | xhigh | max | ultracode
#                 (reasoning depth — available levels depend on the model).
#   pi          → headless Pi — ANY Pi provider. `model` is provider/id.
#                 Subscriptions via /login inside Pi: openai-codex
#                 (ChatGPT Plus/Pro), github-copilot. API keys via env:
#                   openrouter/…   → OPENROUTER_API_KEY  (one key, every model)
#                   xai/…          → XAI_API_KEY         (Grok)
#                   groq/…         → GROQ_API_KEY
#                   google/…       → GEMINI_API_KEY
#                   fireworks/…    → FIREWORKS_API_KEY
#                   deepseek/…     → DEEPSEEK_API_KEY
#                 Full list: Pi docs (providers). Models: `pi` → /model
#   cursor      → Cursor Agent CLI — Cursor subscription. Login:
#                 `cursor-agent login`. Models: `cursor-agent --list-models`
#                 (e.g. sonnet-4.5, gpt-5, composer-1…). Cursor's "effort"
#                 lives in the model id itself (e.g. sonnet-4.5-thinking).
#
# Effort/reasoning per engine:
#   claude_code → `effort` field (low…ultracode)
#   pi          → `thinking` field (minimal|low|medium|high) — on Codex this
#                 is the model's reasoning effort
#   cursor      → model-id variant (…-thinking)
#
# WARNING: Claude INSIDE Pi bills as per-token "extra usage" — to stay on the
# Pro/Max plan, always use coding_agent: claude_code.
#
# fallbacks (optional, per agent or in defaults): an ordered list of up to 5
# engines, walked in three stages:
#   1. RUN START — the primary engine is hard-unavailable (binary missing,
#      provider without login/key). Traced as engine_fallback.
#   2. MID-RUN — the engine dies inside a phase (exits without a report, or its
#      binary vanishes). The death is classified (login | limit | missing |
#      crash) and recorded, the run switches to the next viable fallback IN
#      PLACE and retries the phase. login/limit/missing switch on the first
#      death; a crash retries the same engine once and switches on the second.
#      Traced as engine_error + engine_relay.
#   3. RESUME — `--resume --fda-id <id>` reads the interrupted run's death
#      markers and walks the chain even though the binary checks pass; with no
#      viable fallback it retries the primary out loud (limits reset).
# Every switch is printed and traced — never silent.
#   fallbacks:
#     - { coding_agent: pi, model: openai-codex/gpt-5.6-sol, thinking: high }
#
# Ready-made examples (uncomment/adapt):
#
#   - name: planner             # Fable 5 on the Claude plan, max reasoning
#     coding_agent: claude_code
#     model: fable
#     effort: xhigh
#
#   - name: builder             # Grok 4.5 straight on xAI
#     coding_agent: pi
#     model: xai/grok-4.5
#
#   - name: scout               # Kimi K3 via OpenRouter (one key for all)
#     coding_agent: pi
#     model: openrouter/moonshotai/kimi-k3
#
#   - name: builder             # GPT-5.6 via Copilot (GitHub subscription)
#     coding_agent: pi
#     model: github-copilot/gpt-5.6
#
#   - name: reviewer            # Cursor (subscription) — model from the picker
#     coding_agent: cursor
#     model: claude-opus-5-thinking-high
# ═══════════════════════════════════════════════════════════════════════════

defaults:
  coding_agent: pi
  model: openai-codex/gpt-5.6-sol
  thinking: high
  # relay: auto        # when an engine DIES mid-run: auto (the default when
  #                      this key is absent) switches to the fallbacks in place
  #                      and on --resume; resume = fail fast now, arm the chain
  #                      only on --resume; off = never auto-switch (the death
  #                      is still recorded and traced).
  # session_rotation_context: 180000
  #                    # live-context ceiling (tokens) per agent session. Past
  #                      it, the next phase starts a FRESH session seeded with
  #                      a compact recap instead of resuming the giant one —
  #                      a resumed session re-reads its whole prefix on EVERY
  #                      turn, which is where runaway runs burn most tokens.
  #                      0 = never rotate. Default lives in code
  #                      (imp/modules/continuation.mjs).
  harness_engineering: []
  tools:
    - read
    - bash
    - edit
    - write
    - grep
    - find
    - ls
  protected_files:
    - imp/modules/
    - imp/fia.config.yaml
    - imp/fda_*.mjs
    - imp/scripts/
    - imp/data/prompt_engineering/
    # The two files that JUDGE the agent's work are also protected in code
    # (imp/modules/permissions.mjs) — listing them here is documentation;
    # removing these lines does not unprotect them:
    - imp/data/floor.json # the regression floor (ratchet) — only code raises it, only a human commit lowers it
    - imp/data/holdout/ # holdout probes — acceptance checks the builder never edits
  data_dir: imp/data
  permissions:
    # Changes that build tools make on their own during a phase (e.g. Next.js
    # 16 generates AGENTS.md at build time) are reverted and logged as
    # external_change — they never blame the agent. Included by default:
    # AGENTS.md, next-env.d.ts, **/*.tsbuildinfo, .next/, .turbo/,
    # node_modules/, coverage/, .eslintcache, .DS_Store, Thumbs.db,
    # desktop.ini. Add your project's globs:
    benign_paths: []

observability:
  db: imp/data/fia.db

# stop — how a run is allowed to end. Every run closes with ONE named outcome:
#   goal_met · verification_failed · attempt_cap · no_progress ·
#   budget_exhausted · breadth_exceeded · blocked_by_gate · engine_exhausted ·
#   stopped_by_request · aborted · failed        (only goal_met is success)
# Besides these automatic limits there is a MANUAL stop button: `imp stop`
# (or `npm run fda:stop`) arms imp/data/fia-stop — no new run starts and an
# in-flight run stops cleanly before its next phase (outcome
# stopped_by_request; resume later with --resume). It fails closed: a stop
# file that exists but cannot be read still stops runs. `imp stop --clear`
# disarms it.
# The values below are the CODE defaults — this whole block is optional and a
# missing/typo'd/negative key degrades to the default with a printed warning.
# stop:
#   attempt_cap: 3          # fix rounds the tested FDAs (/task, /bug and the
#                             /goal default fda_sdlc) may spend on a red suite
#                             (/quick has a fixed cap of one round, by design)
#   no_progress_window: 2   # stop when the SAME failing checks AND the same changed
#                             files repeat this many rounds — the run is stuck and
#                             more rounds only spend your plan. 0 = off.
#   budget_minutes: 0       # wall-clock ceiling for one run. 0 = off (the default).
#   token_budget: 30000000  # token ceiling for the RUN LIFETIME (every resume of
#                             the same run counts). Warned at 50% and 80%, stopped
#                             at 100% with outcome budget_exhausted. 0 = off.
#   phase_token_budget: 8000000
#                           # token ceiling for ONE phase (all its sends and relay
#                             legs) — the engine is cut mid-send at the limit, so a
#                             single runaway phase cannot spend the whole plan.
#                             0 = off.
#   phase_timeout_minutes: 50
#                           # wall-clock ceiling for ONE agent send. A hung CLI
#                             with almost no output is killed and retried like a
#                             crash; a timeout after real spend stops the run
#                             cleanly instead of re-paying the phase. 0 = off.
#   breadth_ceiling: 0      # max files one run may touch. 0 = off (the default);
#                             turning it on costs one tree fingerprint per phase,
#                             and a `Kind: foundation` run legitimately touches many.

# sdlc — optional agent phases of the /goal default runner (fda_sdlc). Defaults
# live in code (imp/modules/sdlc-policy.mjs); an absent block behaves exactly
# like them. Both knobs exist to stop paying agent calls that add nothing:
# a sequencer brief already IS the plan, and per-task docs read better written
# once per milestone.
# sdlc:
#   plan: auto              # auto (default) | always | never — `auto` skips the
#                             planner when the brief is self-contained (markdown
#                             sections + acceptance checklist); foundation/kit
#                             briefs and a `Planning: full` line still get one.
#   document: per_milestone # per_milestone (default) | per_task — per_milestone
#                             defers docs to the milestone boundary, where /goal
#                             dispatches one fda_document for the whole milestone.

# qa — browser QA runs (/qa). Unit tests stay in the per-task FDA; this block
# only controls Playwright artifact retention.
# qa:
#   video: retain-on-failure   # off | on | retain-on-failure (default)

# notify — tell you when a run ends, so you can walk away from a long /goal.
# OPT-IN: off unless `enabled: true` AND at least one valid target. Only https://
# targets are accepted (http:// only for localhost). A target URL is treated as a
# secret — only its host is ever printed. A notification can never fail a run.
# The same block is accepted at ~/.impactus-cli/config.json (machine-wide);
# what is written here wins per key. See `imp notify` and `imp settings`.
# notify:
#   enabled: true
#   events: [run_end]       # run_end | gate_blocked | decision_needed — only
#                             run_end is emitted by a run today; gate_blocked and
#                             decision_needed are reserved for a future release.
#   timeout_ms: 4000        # clamped to [500, 20000]
#   targets:
#     - { kind: slack, url: 'https://hooks.slack.com/services/…' }
#     - { kind: telegram, url: 'https://api.telegram.org/bot<token>', chat_id: '123456' }

agents:
  - name: planner
    coding_agent: claude_code
    model: opus
    effort: high
    thinking: high
    color: "#a78bfa"
    purpose: Turn a request into a plan the builder can implement without asking questions.
    fallbacks:
      - { coding_agent: pi, model: openai-codex/gpt-5.6-sol, thinking: high }
    prompt_engineering:
      system: imp/data/prompt_engineering/planner/system.md
      user: imp/data/prompt_engineering/planner/user.md
    writes:
      - specs/
      - ai-docs/
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: builder
    coding_agent: pi
    model: openai-codex/gpt-5.6-sol
    thinking: medium
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    # Repair rounds get concrete failure output to act on — deep reasoning adds
    # cost, not quality, there. Only thinking/effort may vary by phase; the
    # model never does (that would break the session and the cache).
    phase_overrides:
      "fix_*": { thinking: low, effort: low }
      fix: { thinking: low, effort: low }
    fallbacks:
      - { coding_agent: claude_code, model: sonnet, effort: high }
    prompt_engineering:
      system: imp/data/prompt_engineering/builder/system.md
      user: imp/data/prompt_engineering/builder/user.md
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    coding_agent: pi
    model: openai-codex/gpt-5.6-sol
    thinking: low
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing in the repo.
    fallbacks:
      - { coding_agent: claude_code, model: haiku, effort: medium }
    prompt_engineering:
      system: imp/data/prompt_engineering/scout/system.md
      user: imp/data/prompt_engineering/scout/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: reviewer
    coding_agent: claude_code
    model: sonnet
    effort: high
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built matches what was asked; change nothing.
    # The UI-conformance passes audit a fixed rubric against named files — a
    # checklist judgement, not deep reasoning; the functional review keeps the
    # full effort. Both fields set so the override survives an engine relay.
    phase_overrides:
      ui_check: { effort: low, thinking: low }
      ui_verify: { effort: low, thinking: low }
    fallbacks:
      - { coding_agent: pi, model: openai-codex/gpt-5.6-sol, thinking: high }
    prompt_engineering:
      system: imp/data/prompt_engineering/reviewer/system.md
      user: imp/data/prompt_engineering/reviewer/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    coding_agent: pi
    model: openai-codex/gpt-5.6-sol
    # Documentation narrates a diff that already exists — low reasoning reads
    # the same and costs a fraction.
    thinking: low
    color: "#e879f9"
    purpose: Write up the change from the diff; documentation only.
    fallbacks:
      - { coding_agent: claude_code, model: haiku, effort: medium }
    prompt_engineering:
      system: imp/data/prompt_engineering/documenter/system.md
      user: imp/data/prompt_engineering/documenter/user.md
    writes:
      - app_docs/
      - docs/
      - "**/*.md"
      - "*.md"
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit
